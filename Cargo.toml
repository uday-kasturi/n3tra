[workspace]
resolver = "2"
members = [
    "crates/n3t-core",
    "crates/n3t-parse",
    "crates/n3t-advisory",
    "crates/n3t-cli",
]
# Needs nightly (libfuzzer) and must not count against the dependency budget:
# fuzzing is a dev activity, not part of the release artifact.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/lazerwild/n3tra"

# INV-7: reproducible builds. No feature unification surprises, no build scripts
# in the release path that read the environment.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
# Deterministic output; see docs/REPRODUCIBILITY.md for the pinned toolchain image.
debug = false
strip = "symbols"
codegen-units = 1
panic = "abort"
lto = true
