name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain comes from rust-toolchain.toml (INV-7: pinned, never floating).
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      # The corpus tests skip cleanly when tests/corpus is absent, so this job
      # stays green without network. The `corpus` job below is the real check.
      - run: cargo test --workspace

  # Stage 0 hard gate. Runs from day one: a dependency budget is only
  # enforceable before it has been exceeded.
  dependency-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/dep-budget.sh

  # Real-world lockfiles, pinned by commit SHA. These have found two parser bugs
  # that the hand-written fixtures did not (see crates/n3t-parse/tests/corpus.rs).
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/fetch-corpus.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # TEMPORARY diagnostic: the corpus test reports npm-cli at ~2200 on Linux
      # while macOS reports 993 for a byte-identical file. Capture ground truth.
      - name: DIAGNOSTIC corpus npm-cli
        run: |
          f=tests/corpus/npm-cli/package-lock.json
          echo "sha256: $(sha256sum "$f")"
          echo "bytes:  $(wc -c < "$f")"
          python3 -c "import json;d=json.load(open('$f'));pk=d.get('packages',{});print('lockfileVersion',d.get('lockfileVersion'),'| packages',len(pk),'| has_dependencies',('dependencies' in d));print('v3-pushable',sum(1 for k,n in pk.items() if k and 'node_modules/' in k and isinstance(n,dict) and n.get('version')))"
          echo "--- staged counts (raw parse vs scan) ---"
          cargo run -q -p n3t-parse --example diag_npmcli 2>&1 | grep DIAG
      - run: cargo test -p n3t-parse --test corpus

  # Lockfiles are attacker-influenced input (threat model §2), so the parsers are
  # a real attack surface. Short run on PRs; the nightly workflow runs long sessions.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Prebuilt binary. Compiling cargo-fuzz from source against a floating
      # nightly breaks whenever a nightly regresses one of its dependencies.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Pin the fuzz target to the gnu triple. The prebuilt cargo-fuzz is a musl
      # binary and otherwise defaults its --target to musl, whose static libc is
      # incompatible with the address sanitizer ("sanitizer is incompatible with
      # statically linked libc").
      - name: fuzz each target briefly
        run: |
          for target in purl lockfiles advisory; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
              "$target" fuzz/seeds/"$target" \
              -- -max_total_time=60 -runs=2000000 || exit 1
          done

  # INV-12: the release binary must work with no other security tooling present.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/standalone-test.sh

  # INV-7: the build must not vary with time, path, or build order.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/reproducible.sh

  # INV-3: the set of loaded eBPF programs must match docs/HOOKS.md exactly.
  # No-op until Stage 2 adds n3t-observe; wired now so it cannot be forgotten
  # at the moment it starts to matter.
  hook-allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify eBPF attach points against allowlist
        run: |
          if [ -d ebpf ]; then
            cargo test -p n3t-observe --test hook_allowlist
          else
            echo "no ebpf/ yet (pre-Stage 2); allowlist test not applicable"
          fi
