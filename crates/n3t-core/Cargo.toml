[package]
name = "n3t-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "n3tra core types: PURL, artifact dependency graph, verdicts, fixplan schema. No I/O."

[lints.rust]
unsafe_code = "forbid"
