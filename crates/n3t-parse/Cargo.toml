[package]
name = "n3t-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "n3tra L0: native-tooling-first inventory with hand-written lockfile parsers as fallback."

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[dependencies]
n3t-core = { path = "../n3t-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
